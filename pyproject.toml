[project]
name = "jfinances"
version = "0.1.0"
description = "Private household finance tracker on Plaid, Railway and Postgres."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.11",
    "pydantic-settings>=2.15",
    "sqlalchemy>=2.0,<2.2",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "pyjwt[crypto]>=2.15",
    "cryptography>=45",
    "httpx>=0.28",
    "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["server/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom

[tool.pytest.ini_options]
testpaths = ["server/tests"]
